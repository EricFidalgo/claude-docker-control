<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linux Remote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Linux Remote</title>
<style>
  /* Grouped, iOS-style surfaces. Blue is the only colour for actions; green, amber and red only ever mean state.
     Nothing is smaller than 13px, and anything you read for meaning is 15px or more. */
  :root {
    --bg:#f2f2f7; --surface:#fff; --surface-2:#f2f2f7; --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
    --text:#000; --muted:#636366; --faint:#aeaeb2; --line:rgba(60,60,67,.18);
    --accent:#0066d6; --accent-tint:rgba(0,102,214,.1);
    --on:#34c759; --on-text:#1a7f37; --on-tint:rgba(52,199,89,.15);
    --warn:#ff9f0a; --warn-text:#9a4d00; --bad:#ff3b30; --bad-text:#c4000f;
    --switch-off:#e3e3e8; --scrim:rgba(0,0,0,.32); --glass:rgba(242,242,247,.78); --code:#fafafc;
    --ease:cubic-bezier(.32,.72,0,1); /* the curve iOS sheets ride on */
    --r:14px;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fill:rgba(120,120,128,.26); --fill-2:rgba(120,120,128,.36);
    --text:#fff; --muted:#a1a1a8; --faint:#636366; --line:rgba(84,84,88,.6);
    --accent:#4a94ff; --accent-tint:rgba(74,148,255,.18);
    --on:#30d158; --on-text:#30d158; --on-tint:rgba(48,209,88,.18);
    --warn:#ffa31a; --warn-text:#ffb340; --bad:#ff453a; --bad-text:#ff6961;
    --switch-off:#39393d; --scrim:rgba(0,0,0,.6); --glass:rgba(18,18,20,.78); --code:#0d0d0f;
  } }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.35 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
         -webkit-font-smoothing:antialiased; touch-action:manipulation; -webkit-text-size-adjust:100%;
         padding:0 max(16px, env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width:560px; margin:0 auto; }
  button, select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
  ul { list-style:none; margin:0; padding:0; }
  .num { font-variant-numeric:tabular-nums; }
  .warn-t { color:var(--warn-text); } .ok-t { color:var(--on-text); } .act-t { color:var(--accent); } .bad-t { color:var(--bad-text); }

  /* Pressing anything gives way a little, on the press itself. */
  .press { transition:transform .12s ease-out, background-color .2s, opacity .2s; }
  .press:active:not(:disabled) { transform:scale(.97); transition-duration:.06s; }
  .tap:active { background:var(--fill); }

  /* ---- title and compact bar */
  .hero { padding:max(24px, calc(env(safe-area-inset-top) + 16px)) 4px 8px; }
  h1 { font-size:34px; line-height:1.1; font-weight:700; letter-spacing:-.022em; margin:0; }
  .hero p { margin:4px 0 0; color:var(--muted); font-size:17px; }
  .hero .live { color:var(--accent); font-weight:600; }
  #bar { position:fixed; inset:0 0 auto; z-index:5; display:flex; justify-content:center; align-items:center;
         padding:env(safe-area-inset-top) 16px 0; height:calc(env(safe-area-inset-top) + 44px);
         background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%);
         font-size:17px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s; }
  #bar::after { content:""; position:absolute; inset:auto 0 0; height:1px; background:var(--line); }
  #bar.show { opacity:1; }

  #offline { display:none; align-items:center; gap:12px; margin:16px 0 0; padding:14px 16px; border-radius:var(--r);
             background:var(--surface); color:var(--bad-text); font-size:17px; }
  #offline.show { display:flex; }

  section { margin-top:28px; }
  h2 { font-size:22px; line-height:1.2; font-weight:700; letter-spacing:-.012em; margin:0 4px 10px; }
  .card { background:var(--surface); border-radius:var(--r); overflow:hidden; }
  .card + .card, .gap { margin-top:12px; }
  /* iOS hairlines: inset from the left edge, never full width. */
  .sep > li, .sep > .item { position:relative; }
  .sep > li + li::before, .sep > .item + .item::before { content:""; position:absolute; top:0; right:0; left:var(--inset, 16px);
                                                         height:1px; background:var(--line); }

  /* ---- this computer: three big readings, then plain rows */
  .stats { display:grid; grid-template-columns:repeat(var(--n, 3), 1fr); }
  .stat { position:relative; min-width:0; padding:14px 14px 16px 16px; border:0; background:none; text-align:left; }
  .stat + .stat::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:1px; background:var(--line); }
  .stat .k { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:15px; }
  .stat .v { font-size:30px; line-height:1.15; font-weight:600; letter-spacing:-.02em; margin-top:2px; white-space:nowrap; }
  .stat .v small { font-size:17px; font-weight:500; color:var(--muted); letter-spacing:0; margin-left:1px; }
  .stat[aria-expanded="true"] .chev { transform:rotate(135deg) translate(-1px, -1px); }
  .meter { height:5px; border-radius:3px; background:var(--fill); margin-top:10px; overflow:hidden; }
  .meter i { display:block; height:100%; width:100%; border-radius:3px; background:var(--on); transform-origin:left;
             transform:scaleX(var(--p, 0)); transition:transform .6s var(--ease); }
  .meter i.warn { background:var(--warn); } .meter i.bad { background:var(--bad); }

  .lrow { display:flex; flex-wrap:wrap; align-items:center; column-gap:12px; width:100%; min-height:52px; padding:13px 16px;
          border:0; background:none; text-align:left; font-size:17px; }
  .lrow .l { flex:1; min-width:0; }
  .lrow .v { color:var(--muted); text-align:right; }
  .lrow .meter { flex-basis:100%; margin-top:8px; }
  .lrow.sub-row { min-height:44px; padding:11px 16px; font-size:15px; }
  .lrow.sub-row .l { color:var(--muted); }
  .lrow.sub-row .v { color:var(--text); max-width:65%; }
  .lrow[aria-expanded="true"] .chev { transform:rotate(135deg) translate(-1px, -1px); }

  .mem { padding:6px 16px 8px; }
  .mem h3 { display:flex; justify-content:space-between; margin:8px 0 2px; font-size:17px; font-weight:600; }
  .mem h3 span { color:var(--muted); font-weight:400; }
  .mem h4 { margin:14px 0 0; color:var(--muted); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .mrow { display:grid; grid-template-columns:1fr auto; column-gap:12px; padding:10px 0; font-size:17px; }
  .mrow + .mrow { border-top:1px solid var(--line); }
  .mrow .l { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mrow .b { color:var(--muted); }
  .mrow .meter { grid-column:1 / -1; margin-top:6px; height:4px; }
  .mrow .meter i { background:var(--muted); }
  .mrow.rest .meter i { background:var(--faint); }

  .chev { flex:none; width:8px; height:8px; border:solid var(--faint); border-width:2px 2px 0 0; transform:rotate(45deg);
          margin:0 4px 0 0; transition:transform .25s var(--ease); }

  /* ---- rows: apps and programs share one shape */
  #list, #progs { --inset:68px; }
  .row { display:flex; align-items:center; gap:10px; padding:0 16px 0 0; min-height:68px; }
  .expand { flex:1; align-self:stretch; min-width:0; display:flex; align-items:center; gap:14px; border:0; background:none;
            padding:12px 0 12px 16px; text-align:left; }
  .icon { flex:none; width:38px; height:38px; border-radius:10px; display:grid; place-items:center;
          background:var(--fill); color:var(--muted); font-size:17px; font-weight:600; transition:background-color .3s, color .3s; }
  .icon.on { background:var(--on); color:#fff; }
  .icon.warn { background:var(--warn); color:#fff; }
  .icon.bad { background:var(--bad); color:#fff; }
  /* A real icon: the picture shows what it is, a dot in the corner shows its state (none = off). */
  .icon.pic { position:relative; background:var(--fill); }
  .icon.pic img { width:100%; height:100%; border-radius:inherit; object-fit:cover; transition:opacity .3s, filter .3s; }
  .icon.pic:not(.on):not(.warn):not(.bad) img { opacity:.55; filter:grayscale(.6); }
  .icon.pic::after { content:""; position:absolute; right:-3px; bottom:-3px; width:12px; height:12px; border-radius:50%;
                     border:2px solid var(--surface); background:transparent; transition:background-color .3s; }
  .icon.pic:not(.on):not(.warn):not(.bad)::after { display:none; }
  .icon.pic.on::after { background:var(--on); }
  .icon.pic.warn::after { background:var(--warn); }
  .icon.pic.bad::after { background:var(--bad); }
  .info { flex:1; min-width:0; }
  .name { font-weight:600; font-size:17px; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub { color:var(--muted); font-size:15px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub.err { color:var(--bad-text); white-space:normal; }
  .sub.wrap { white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
  .app.open { background:linear-gradient(var(--surface), var(--surface)); }
  .app.open .expand .name { color:var(--accent); }

  .btn { flex:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:36px; padding:0 16px;
         border:0; border-radius:999px; background:var(--fill); color:var(--text); font-size:15px; font-weight:600;
         text-decoration:none; white-space:nowrap; }
  .btn.primary { background:var(--accent); color:#fff; }
  .btn.tint { background:var(--accent-tint); color:var(--accent); }
  .btn.danger { color:var(--bad-text); }
  .btn:disabled { opacity:.38; cursor:default; }
  /* Open, as a round arrow: it says "leave to this app" and leaves room for the name. */
  .go { flex:none; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--accent-tint); color:var(--accent); }
  .go svg { width:18px; height:18px; }
  @media (hover:hover) { .btn:hover:not(:disabled) { background:var(--fill-2); } .btn.primary:hover:not(:disabled) { filter:brightness(1.08); background:var(--accent); }
                         .btn.tint:hover:not(:disabled), .go:hover { filter:brightness(1.05); } }

  /* iOS switch */
  .sw { position:relative; flex:none; width:51px; height:31px; border:0; padding:0; border-radius:16px; background:var(--switch-off);
        transition:background-color .25s; }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff;
               box-shadow:0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition:transform .3s var(--ease); }
  .sw.on { background:var(--on); }
  .sw.on::after { transform:translateX(20px); }
  .sw.partial { background:var(--warn); }
  .sw.partial::after { transform:translateX(10px); }
  .sw.busy { animation:breathe 1.2s ease-in-out infinite; }
  .sw:disabled { cursor:default; }
  @keyframes breathe { 50% { opacity:.45; } }

  /* app details: what it is, what you can do, then the parts */
  .detail { padding:0 16px 18px; }
  .note { margin:0 0 14px; color:var(--muted); font-size:15px; line-height:1.4; text-wrap:pretty; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .actions .btn { flex:1 1 0; min-width:max-content; min-height:40px; }
  .detail h4 { margin:18px 0 6px; color:var(--muted); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .group { background:var(--surface-2); border-radius:12px; overflow:hidden; --inset:34px; }
  .item { display:flex; align-items:center; gap:10px; padding:10px 12px; min-height:52px; }
  .item .name { font-size:15px; font-weight:600; }
  .item .sub { font-size:13px; white-space:normal; }
  .item .btns { display:flex; gap:6px; }
  .item .btn { min-height:32px; padding:0 12px; font-size:15px; background:var(--surface); }
  @media (prefers-color-scheme: dark) { .item .btn { background:var(--fill-2); } }
  .item .btn.primary { background:var(--accent); }
  .dot { flex:none; width:10px; height:10px; border-radius:50%; background:var(--faint); }
  .dot.on { background:var(--on); } .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }

  .bulk { display:grid; grid-template-columns:1fr 1fr; }
  .bulk button { position:relative; min-height:50px; border:0; background:none; font-size:17px; color:var(--accent); }
  .bulk button + button { color:var(--bad-text); }
  .bulk button + button::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:1px; background:var(--line); }
  @media (hover:hover) { .bulk button:hover { background:var(--fill); } }

  .prog .row { padding-left:16px; gap:14px; }
  .prog .btns { display:flex; gap:8px; }

  /* ---- the tab bar along the bottom, iOS style */
  #tabs { position:fixed; inset:auto 0 0; z-index:10; display:flex; justify-content:center;
          padding:6px max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
          background:var(--glass); -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); }
  #tabs::before { content:""; position:absolute; inset:0 0 auto; height:1px; background:var(--line); }
  #tabs button { flex:1; max-width:160px; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:50px;
                 border:0; background:none; color:var(--muted); font-size:13px; font-weight:600; transition:color .2s; }
  #tabs svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #tabs button[aria-selected="true"] { color:var(--accent); }
  .pane > section:first-child { margin-top:16px; }
  .empty { color:var(--muted); font-size:15px; text-align:center; margin:24px 4px; }

  .foot { color:var(--muted); font-size:13px; margin:28px 4px 0; text-align:center; text-wrap:balance; }

  /* ---- loading skeleton, shaped like what arrives */
  .sk { height:104px; }
  .sk-row { height:68px; display:flex; align-items:center; gap:14px; padding:0 16px; }
  .sk-row i { display:block; background:var(--fill); border-radius:10px; }
  @media (prefers-reduced-motion: no-preference) { .sk, .sk-row i { animation:breathe 1.6s ease-in-out infinite; } }

  /* ---- sheets: one for questions, one for logs */
  .scrim { position:fixed; inset:0; z-index:20; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .3s; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; z-index:21; left:0; right:0; bottom:0; margin:0 auto; max-width:560px; transform:translateY(105%);
           transition:transform .42s var(--ease); overscroll-behavior:contain; }
  .sheet.show { transform:none; }
  #ask { padding:0 8px max(8px, env(safe-area-inset-bottom)); }
  #ask .box { background:var(--glass); -webkit-backdrop-filter:blur(30px) saturate(180%); backdrop-filter:blur(30px) saturate(180%);
              border-radius:14px; overflow:hidden; text-align:center; }
  #ask .msg { padding:18px 20px; color:var(--muted); font-size:15px; line-height:1.4; }
  #ask .msg b { display:block; color:var(--text); font-size:17px; font-weight:600; margin-bottom:4px; }
  #ask button { display:block; width:100%; min-height:56px; border:0; border-top:1px solid var(--line); background:none;
                font-size:20px; color:var(--accent); }
  #ask button.danger { color:var(--bad-text); }
  #ask .cancel { margin-top:8px; border:0; border-radius:14px; background:var(--surface); font-weight:600; }

  #logs { top:max(12px, env(safe-area-inset-top)); display:flex; flex-direction:column; background:var(--bg); border-radius:14px 14px 0 0;
          box-shadow:0 -8px 40px rgba(0,0,0,.18); overflow:hidden; }
  #logs .grab { width:36px; height:5px; border-radius:3px; background:var(--fill-2); margin:6px auto 0; flex:none; }
  #logs .top { display:flex; align-items:center; gap:8px; padding:8px 12px 10px 16px; flex:none; }
  #logs .top .t { flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #logs select { border:0; border-radius:999px; background:var(--fill); color:var(--text); min-height:36px; padding:0 10px; font-size:15px; }
  #logtext { flex:1; margin:0; overflow:auto; padding:14px 16px max(16px, env(safe-area-inset-bottom)); background:var(--code);
             border-top:1px solid var(--line); white-space:pre-wrap; word-break:break-word; overscroll-behavior:contain;
             font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; -webkit-overflow-scrolling:touch; }

  #toast { position:fixed; z-index:30; left:50%; bottom:calc(72px + env(safe-area-inset-bottom)); width:max-content; max-width:calc(100% - 32px);
           transform:translate(-50%, 150%); padding:12px 18px; border-radius:var(--r); text-align:center; background:var(--text); color:var(--bg);
           font-size:15px; font-weight:500; box-shadow:0 8px 30px rgba(0,0,0,.2); visibility:hidden;
           transition:transform .4s var(--ease), visibility 0s .4s; }
  #toast.show { transform:translate(-50%, 0); visibility:visible; transition:transform .4s var(--ease); }

  @media (max-width:360px) { .stat .v { font-size:26px; } .stat { padding-left:12px; padding-right:10px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration:.01ms !important; animation:none !important; }
    .sheet:not(.show), #toast:not(.show) { opacity:0; }
  }
  @media (prefers-reduced-transparency: reduce) {
    #bar, #ask .box, #tabs { background:var(--surface); -webkit-backdrop-filter:none; backdrop-filter:none; }
  }
</style>
<script src="/lock.js" data-name="Linux Remote" data-setup="dock password"></script>
</head>
<body>
<div id="bar" aria-hidden="true"></div>
<main>
  <header class="hero">
    <h1 id="title">Linux Remote</h1>
    <p id="status" aria-live="polite">Connecting…</p>
  </header>

  <div id="offline" role="alert"><span class="dot bad"></span><span>Can’t reach the PC. Check it’s awake and on Tailscale.</span></div>

  <div class="pane" id="tab-system" role="tabpanel" aria-labelledby="t-system">
    <section aria-label="Live readings">
      <div class="card stats" id="stats"><div class="sk"></div></div>
      <div id="mem"></div>
    </section>
    <section aria-labelledby="h-host">
      <h2 id="h-host">Storage and More</h2>
      <ul class="card sep" id="hostlist"></ul>
    </section>
  </div>

  <div class="pane" id="tab-docker" role="tabpanel" aria-labelledby="t-docker" hidden>
    <section aria-label="Docker apps">
      <ul class="card sep" id="list">
        <li class="sk-row"><i style="width:38px;height:38px"></i><i style="width:45%;height:16px"></i></li>
        <li class="sk-row"><i style="width:38px;height:38px"></i><i style="width:35%;height:16px"></i></li>
        <li class="sk-row"><i style="width:38px;height:38px"></i><i style="width:50%;height:16px"></i></li>
      </ul>
      <div class="card bulk"><button class="press" id="all-on">Start All</button><button class="press" id="all-off">Stop All</button></div>
    </section>
    <p class="foot" id="foot"></p>
  </div>

  <div class="pane" id="tab-apps" role="tabpanel" aria-labelledby="t-apps" hidden>
    <section aria-label="Programs on this PC">
      <ul class="card sep" id="progs"></ul>
      <p class="empty" id="progs-empty" hidden>No desktop programs are set up yet.</p>
    </section>
  </div>
</main>

<nav id="tabs" role="tablist" aria-label="Sections">
  <button role="tab" id="t-system" data-tab="system" aria-controls="tab-system">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 12l2.5-3 2.5 2 4-4"/></svg>System</button>
  <button role="tab" id="t-docker" data-tab="docker" aria-controls="tab-docker">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>Docker</button>
  <button role="tab" id="t-apps" data-tab="apps" aria-controls="tab-apps">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>Apps</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="ask" role="alertdialog" aria-modal="true" aria-labelledby="ask-t" aria-describedby="ask-m">
  <div class="box"><div class="msg"><b id="ask-t"></b><span id="ask-m"></span></div><button class="press" id="ask-ok"></button></div>
  <button class="press cancel" id="ask-no">Cancel</button>
</div>
<div class="sheet" id="logs" role="dialog" aria-modal="true" aria-labelledby="logtitle">
  <div class="grab"></div>
  <div class="top">
    <div class="t" id="logtitle" translate="no">Logs</div>
    <select id="loglines" aria-label="How many lines"><option value="100">100 lines</option><option value="300" selected>300 lines</option><option value="1000">1000 lines</option></select>
    <button class="btn press" id="logrefresh">Refresh</button>
    <button class="btn primary press" id="logclose">Done</button>
  </div>
  <pre id="logtext" tabindex="0"></pre>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const post = (path) => fetch(path, { method: "POST", headers: { "X-Dock": "1" } });
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const opened = new Set(JSON.parse(store.get("dock.open") || "[]"));
let state = null;
let hostMore = !!store.get("dock.hostmore");
const pending = new Set();  // programs just asked to open or close

// ---- formatting
const one = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1, minimumFractionDigits: 1 });
const whole = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 });
function gbParts(b) {
  const g = b / 1024 ** 3;
  return g >= 1000 ? [one.format(g / 1024), "TB"] : [g >= 100 ? whole.format(g) : one.format(g), "GB"];
}
const gb = (b) => gbParts(b).join(" ");
const size = (b) => b < 1000 * 1024 ** 2 ? `${whole.format(b / 1024 ** 2)} MB` : gb(b);
// A length of time in seconds, said the short way: "3d 4h", "2h 5m", "12m".
function dur(s) {
  s = Math.max(0, s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m` : `${Math.floor(s)}s`;
}
const ago = (iso) => !iso || iso.startsWith("0001") ? "" : dur((Date.now() - new Date(iso)) / 1000);
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const working = (a) => !!a.busy && !a.busy.startsWith("error");
const lit = (a) => a.state === "on" || a.state === "partial";
const level = (pct) => pct > 90 ? "bad" : pct > 75 ? "warn" : "";
function meter(frac, cls = "") {
  const m = el("div", "meter"), i = el("i", cls);
  i.style.setProperty("--p", Math.min(1, Math.max(0, frac)));
  m.append(i);
  return m;
}
const ARROW = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>';

// ---- the question sheet and the toast, in place of the browser's own popups
let answer = null;
function ask(title, message, ok, danger = false) {
  $("ask-t").textContent = title;
  $("ask-m").textContent = message || "";
  $("ask-ok").textContent = ok;
  $("ask-ok").className = "press" + (danger ? " danger" : "");
  show("ask", true);
  $(danger ? "ask-no" : "ask-ok").focus({ preventScroll: true });
  return new Promise((res) => { answer = res; });
}
function settle(v) { if (!answer) return; const r = answer; answer = null; show("ask", false); r(v); }
$("ask-ok").onclick = () => settle(true);
$("ask-no").onclick = () => settle(false);

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 4000);
}

let lastFocus = null;
function show(id, on) {
  if (on) lastFocus = document.activeElement;
  $(id).classList.toggle("show", on);
  $("scrim").classList.toggle("show", ["ask", "logs"].some((s) => $(s).classList.contains("show")));
  document.body.style.overflow = $("scrim").classList.contains("show") ? "hidden" : "";
  for (const s of ["ask", "logs"]) $(s).inert = !$(s).classList.contains("show");
  if (!on && lastFocus) lastFocus.focus?.({ preventScroll: true });
}
$("ask").inert = $("logs").inert = true;
$("scrim").onclick = () => { if (answer) settle(false); else closeLogs(); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (answer) settle(false); else if (logName) closeLogs(); } });

// ---- actions
async function act(app, action) {
  if (action === "off" && !await ask(`Stop ${app.label}?`, "Its containers stop. Data and settings are kept.", "Stop", true)) return;
  if (action === "restart" && !await ask(`Restart ${app.label}?`, "It’s unavailable for a few seconds.", "Restart")) return;
  // GPU apps share the card's memory; a second one can run either out of it.
  if (action === "on" && app.gpu_clash.length &&
      !await ask(`Start ${app.label}?`, `${app.gpu_clash.join(" and ")} ${app.gpu_clash.length > 1 ? "are" : "is"} already on the GPU (${gpuLine(state.host.gpu)}). ` +
                 `${app.label} uses it too, and both may not fit.`, "Start Anyway")) return;
  if (action === "update" && !await ask(`Update ${app.label}?`, `Downloads the newer image for ${app.updates.join(", ")} ` +
                                        `and recreates its containers. Data and settings are kept.`, "Update")) return;
  markBusy([app.id], VERB[action]);
  try {
    const r = await post(`/api/apps/${app.id}/${action}`);
    if (r.status === 409) toast(`${app.label} is still busy. Try again in a few seconds.`);
  } catch { toast("Can’t reach the PC right now."); }
  refresh();
}

// Show the switch working the moment it's tapped, not a poll later; the PC's answer then takes over.
const VERB = { on: "starting", off: "stopping", restart: "restarting", update: "updating" };
function markBusy(ids, label) {
  for (const a of state?.apps || []) if (ids.includes(a.id) && !working(a)) a.busy = label;
  seq++;  // a poll already on its way left before the tap; don't let it flip the switch back
  render(); status();
}

async function restartContainer(name) {
  if (!await ask(`Restart ${name}?`, "", "Restart")) return;
  try {
    const r = await post(`/api/containers/${encodeURIComponent(name)}/restart`);
    if (r.status === 409) toast("That app is still busy. Try again in a few seconds.");
  } catch { toast("Can’t reach the PC right now."); }
  refresh();
}

async function program(p, action) {
  if (action === "close" && !await ask(`Close ${p.label} on the PC?`, "Anything unsaved in it may be lost.", "Close", true)) return;
  pending.add(p.id);
  render();
  // Programs take a few seconds to show up; keep the button dimmed until the next polls catch it.
  setTimeout(() => { pending.delete(p.id); refresh(); }, 4000);
  try {
    const r = await post(`/api/programs/${p.id}/${action}`);
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      toast(`Couldn’t ${action} ${p.label}: ${e.error || r.status}`);
    } else if (action === "later") toast(`${p.label} stays open another hour.`);
  } catch { toast(`Couldn’t reach the PC to ${action === "later" ? "keep" : action} ${p.label}.`); }
  refresh();
}

// ---- this computer
// Three live readings in one card. Memory is a button that opens what's using it.
function stat(k, pct, { onTap, expanded } = {}) {
  const t = el(onTap ? "button" : "div", "stat" + (onTap ? " press" : ""));
  const key = el("div", "k", k);
  const val = el("div", "v num", pct == null ? "…" : whole.format(pct));
  if (pct != null) val.append(el("small", null, "%"));
  if (onTap) {
    key.append(el("span", "chev"));
    t.onclick = onTap;
    t.setAttribute("aria-expanded", expanded);
    t.setAttribute("aria-label", `${k} ${whole.format(pct)}% used. Show what’s using it`);
  }
  t.append(key, val, meter((pct ?? 0) / 100, level(pct ?? 0)));
  return t;
}
// A plain row: label on the left, value on the right, an optional bar underneath.
function lrow(label, value, { frac, cls = "", onTap, expanded } = {}) {
  const r = el(onTap ? "button" : "div", "lrow " + cls + (onTap ? " tap" : ""));
  r.append(el("span", "l", label));
  if (value != null) { const v = el("span", "v num"); v.append(value); r.append(v); }
  if (onTap) { r.append(el("span", "chev")); r.onclick = onTap; r.setAttribute("aria-expanded", expanded); }
  if (frac != null) r.append(meter(frac, level(frac * 100)));
  return r;
}
const li = (...kids) => { const l = el("li"); l.append(...kids); return l; };

function renderHost(h, apps) {
  const memPct = 100 * h.mem.used / h.mem.total;
  const cells = [
    stat("CPU", h.cpu),
    stat("Memory", memPct),
  ];
  if (h.gpu) cells.push(stat("GPU", 100 * h.gpu.used / h.gpu.total));
  $("stats").style.setProperty("--n", cells.length);
  $("stats").replaceChildren(...cells);
  $("mem").replaceChildren(memoryCard(h.mem, apps));

  const rows = h.disks.map((d) => li(lrow(d.label, `${gb(d.total - d.used)} free`, { frac: d.used / d.total })));
  rows.push(li(lrow("Backup", backupLine(h.backup))));
  rows.push(li(lrow("Details", null, { onTap: () => { hostMore = !hostMore; store.set("dock.hostmore", hostMore ? "1" : ""); render(); }, expanded: hostMore })));
  if (hostMore) {
    const add = (k, v) => rows.push(li(lrow(k, v, { cls: "sub-row" })));
    add("Computer", h.name);
    add("Up for", dur(h.uptime));
    add("Processor", `${h.cores} cores · load ${h.load.map((x) => x.toFixed(2)).join(", ")}`);
    add("Memory", `${gb(h.mem.used)} of ${gb(h.mem.total)}`);
    for (const d of h.disks) add(d.label, `${gb(d.used)} used of ${gb(d.total)}`);
    if (h.gpu) {
      add("GPU", h.gpu.name || "GPU");
      add("GPU memory", `${gb(h.gpu.used)} of ${gb(h.gpu.total)}`);
      add("Using GPU", gpuLine(h.gpu));
      const extra = [h.gpu.util != null && `${h.gpu.util}% busy`, h.gpu.temp != null && `${h.gpu.temp}°C`].filter(Boolean);
      if (extra.length) add("GPU now", extra.join(" · "));
    }
    if (h.docker) {
      const d = h.docker;
      add("Docker images", gb(d.images));
      // Unique size: what removing them frees. Layers they share with images in use stay.
      if (d.unused) add("Unused images", `${d.unused} · ~${size(d.unused_bytes)} to free`);
      if (d.cache > 100 * 1024 ** 2) add("Build cache", size(d.cache));
    }
  }
  $("hostlist").replaceChildren(...rows);
}

// Where the used RAM goes: Docker apps (from docker stats), big programs outside Docker, and the rest
// (the desktop, the kernel and many small processes), so the rows add up to the Memory reading.
function memoryCard(mem, apps) {
  const card = el("div", "card mem");
  const head = el("h3", null, "What’s using memory"); head.append(el("span", "num", `${gb(mem.used)} of ${gb(mem.total)}`));
  card.append(head);
  const row = (label, bytes, cls = "") => {
    const r = el("div", "mrow " + cls);
    r.append(el("span", "l", label), el("span", "b num", size(bytes)), meter(bytes / mem.total));
    return r;
  };
  const dockerApps = apps.map((a) => ({ label: a.label, bytes: a.containers.reduce((n, c) => n + (c.mem_bytes || 0), 0) }))
    .filter((a) => a.bytes > 0).sort((a, b) => b.bytes - a.bytes);
  const programs = mem.programs || [];
  if (dockerApps.length) card.append(el("h4", null, "Docker apps"), ...dockerApps.map((a) => row(a.label, a.bytes)));
  if (programs.length) card.append(el("h4", null, "Outside Docker"), ...programs.map((p) => row(p.label, p.bytes)));
  const rest = mem.used - [...dockerApps, ...programs].reduce((n, x) => n + x.bytes, 0);
  if (rest > 0) card.append(el("h4", null, "Everything else"), row("System and small programs", rest, "rest"));
  const wrap = el("div", "gap"); wrap.append(card);
  return wrap;
}

function gpuLine(g) {
  if (!g || !g.users.length) return "Nothing";
  return g.users.map((u) => `${u.label} ${size(u.mem)}`).join(", ");
}
// The backup timer runs nightly, so past 36 hours a run has been missed or has failed.
function backupLine(b) {
  if (!b) return "Not set up";
  if (b.age == null) return el("span", "warn-t", "None yet");
  if (b.age > 36 * 3600) return el("span", "warn-t", `Overdue · ${dur(b.age)} ago`);
  if (b.warnings) return el("span", "warn-t", `${dur(b.age)} ago · ${b.warnings} warning${b.warnings > 1 ? "s" : ""}`);
  return `${dur(b.age)} ago`;
}

// ---- apps
// The app's own picture when the PC has one, otherwise its first letter (also if the picture fails to load).
// Each picture is loaded once and the same one moved into every redraw, so icons don't blink every poll.
const pics = new Map(), badPics = new Set();
function iconFor(label, cls, src) {
  const letter = el("span", "icon " + (cls || ""), (label.trim()[0] || "?").toUpperCase());
  if (!src || badPics.has(src)) return letter;
  const box = el("span", "icon pic " + (cls || ""));
  let img = pics.get(src);
  if (!img) {
    img = new Image(); img.alt = ""; img.src = src;
    img.onerror = () => { badPics.add(src); pics.delete(src); img.closest(".icon")?.replaceWith(letter); };
    pics.set(src, img);
  }
  box.append(img);
  return box;
}

// One short status, never the app's description: that lives in its details.
function subline(a) {
  const sub = el("div", "sub");
  if (a.busy && a.busy.startsWith("error")) { sub.className += " err"; sub.textContent = "Didn’t work: " + a.busy.replace(/^error:\s*/, ""); return sub; }
  if (working(a)) { sub.append(el("span", "act-t", cap(a.busy) + "…")); return sub; }
  // Docker retrying a container that dies at once: say so, rather than a plain "Off" that invites another tap.
  if (a.containers.some((c) => c.state === "restarting")) { sub.className += " err"; sub.textContent = "Keeps crashing · open for logs"; return sub; }
  if (a.state === "partial") sub.append(el("span", "warn-t", `${a.running} of ${a.total} running`));
  else if (a.state === "on") sub.append(el("span", "ok-t", "Running"));
  else if (a.state === "missing") sub.append("Not set up yet");
  else sub.append("Off");
  if (a.updates.length && a.can_update) sub.append(" · Update ready");
  return sub;
}

function containerItem(a, c) {
  const it = el("div", "item");
  const bad = c.running && c.health === "unhealthy";
  const dot = el("span", "dot" + (!c.running ? "" : bad ? " bad" : c.health === "starting" ? " warn" : " on"));
  const info = el("div", "info");
  info.append(el("div", "name", c.name));
  const bits = [];
  if (c.running) {
    bits.push(`Up ${ago(c.started)}`);
    if (c.mem_bytes) bits.push(size(c.mem_bytes));
    if (c.health && c.health !== "healthy") bits.push(c.health);
  } else {
    bits.push(cap(c.state) + (c.exit ? ` (code ${c.exit})` : "") + (ago(c.finished) ? ` ${ago(c.finished)} ago` : ""));
  }
  if (c.restarts) bits.push(`${c.restarts} restarts`);
  info.append(el("div", "sub num", bits.join(" · ")));
  if (c.error) info.append(el("div", "sub err", c.error));
  if (c.update) info.append(el("div", "sub act-t", "Newer image available"));
  const btns = el("div", "btns");
  const logs = el("button", "btn press", "Logs"); logs.onclick = () => openLogs(c.name);
  logs.setAttribute("aria-label", `Logs for ${c.name}`);
  btns.append(logs);
  if (c.running) {
    const rs = el("button", "btn press", "Restart"); rs.disabled = working(a); rs.onclick = () => restartContainer(c.name);
    rs.setAttribute("aria-label", `Restart ${c.name}`);
    btns.append(rs);
  }
  it.append(dot, info, btns);
  return it;
}

function goLink(href, label) {
  const o = el("a", "go press");
  o.innerHTML = ARROW;
  o.href = href; o.target = "_blank"; o.rel = "noopener";
  o.setAttribute("aria-label", `Open ${label}`);
  return o;
}

function linkItem(w) {
  const it = el("div", "item");
  const info = el("div", "info");
  info.append(el("div", "name", w.label));
  info.append(el("div", "sub", !w.phone ? "Only on the PC" : w.up ? "Ready" : "Starts with the app"));
  it.append(el("span", "dot" + (w.up ? " on" : "")), info);
  if (w.phone) { const o = el("a", "btn primary press", "Open"); o.href = w.phone; o.target = "_blank"; o.rel = "noopener"; if (!w.up) o.style.opacity = ".45"; it.append(o); }
  return it;
}

function renderApps(apps) {
  $("list").replaceChildren(...apps.map((a) => {
    const isOpen = opened.has(a.id);
    const item = el("li", "app" + (isOpen ? " open" : ""));
    const row = el("div", "row");
    const err = a.busy && a.busy.startsWith("error");
    const ex = el("button", "expand tap");
    ex.setAttribute("aria-expanded", isOpen);
    ex.setAttribute("aria-controls", `d-${a.id}`);
    const info = el("div", "info"); info.append(el("div", "name", a.label), subline(a));
    ex.append(iconFor(a.label, err ? "bad" : a.state === "partial" ? "warn" : a.state === "on" ? "on" : "", a.icon), info);
    ex.onclick = () => { isOpen ? opened.delete(a.id) : opened.add(a.id); store.set("dock.open", JSON.stringify([...opened])); render(); };
    const sw = el("button", "sw" + (lit(a) ? " " + a.state : "") + (working(a) ? " busy" : ""));
    sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", a.state === "on" ? "true" : a.state === "partial" ? "mixed" : "false");
    sw.setAttribute("aria-label", a.label);
    sw.disabled = working(a);
    // A lit switch (on, or partly on) turns the whole app off; a dark one turns it on.
    sw.onclick = () => act(a, lit(a) ? "off" : "on");
    // The app's main page, right in the row once it's up; any others are in the details.
    const main = a.web.find((w) => w.exists && w.phone);
    row.append(ex);
    if (main && main.up) row.append(goLink(main.phone, main.label));
    row.append(sw);

    item.append(row);
    if (isOpen) {  // details are only built while open; polls redraw every 3 seconds
      const det = el("div", "detail"); det.id = `d-${a.id}`;
      if (a.note) det.append(el("p", "note", a.note));
      const acts = el("div", "actions");
      const cantAct = working(a) || a.state === "off" || a.state === "missing";
      if (a.updates.length && a.can_update) {
        const up = el("button", "btn primary press", "Update"); up.disabled = working(a); up.onclick = () => act(a, "update");
        acts.append(up);
      }
      const rs = el("button", "btn press", "Restart"); rs.disabled = cantAct; rs.onclick = () => act(a, "restart");
      rs.setAttribute("aria-label", `Restart ${a.label}`);
      const st = el("button", "btn danger press", "Stop"); st.disabled = cantAct; st.onclick = () => act(a, "off");
      st.setAttribute("aria-label", `Stop ${a.label}`);
      acts.append(rs, st);
      det.append(acts);
      const pages = a.web.filter((w) => w.exists);
      if (pages.length) { const g = el("div", "group sep"); g.append(...pages.map(linkItem)); det.append(el("h4", null, pages.length > 1 ? "Pages" : "Page"), g); }
      if (a.containers.length) {
        const g = el("div", "group sep"); g.append(...a.containers.map((c) => containerItem(a, c)));
        det.append(el("h4", null, a.containers.length > 1 ? "Containers" : "Container"), g);
      }
      item.append(det);
    }
    return item;
  }));
}

// ---- desktop programs
function renderPrograms(progs) {
  $("progs").hidden = !progs.length;
  $("progs-empty").hidden = !!progs.length;
  $("progs").replaceChildren(...progs.map((p) => {
    const item = el("li", "prog");
    const row = el("div", "row");
    const info = el("div", "info");
    const sub = el("div", "sub num");
    if (p.running) {
      sub.append(el("span", "ok-t", "Open"));
      if (p.closes_in != null) sub.append(` · closes in ${p.closes_in < 3600 ? Math.ceil(p.closes_in / 60) + " min" : dur(p.closes_in)}`);
      // Idle close: once the PC has sat untouched a few minutes, count down; before that, just say the rule.
      else if (p.idle_left != null) {
        const m = Math.ceil(p.idle_left / 60);
        sub.classList.add("wrap");
        sub.append(p.idle_left < 60 ? " · closing, PC idle" : p.idle_left < p.idle_minutes * 60 - 300 ? ` · closes in ${m} min if idle` : ` · closes after ${p.idle_minutes} min idle`);
      }
    } else { sub.textContent = p.note; sub.classList.add("wrap"); }
    info.append(el("div", "name", p.label), sub);
    const btns = el("div", "btns");
    // On a timer but still in use? Push it back an hour.
    if (p.running && p.closes_in != null) {
      const l = el("button", "btn press", "+1 h"); l.onclick = () => program(p, "later");
      l.setAttribute("aria-label", `Keep ${p.label} open another hour`);
      btns.append(l);
    }
    const b = el("button", "btn press " + (p.running ? "" : "tint"), pending.has(p.id) ? "…" : p.running ? "Close" : "Open");
    b.disabled = pending.has(p.id);
    b.setAttribute("aria-label", `${p.running ? "Close" : "Open"} ${p.label}`);
    b.onclick = () => program(p, p.running ? "close" : "open");
    btns.append(b);
    row.append(iconFor(p.label, p.running ? "on" : "", p.icon), info, btns);
    item.append(row);
    return item;
  }));
}

function render() {
  if (!state) return;
  renderApps(state.apps);
  renderPrograms(state.programs || []);
  renderHost(state.host, state.apps);
  const foot = [];
  if (state.unlisted.length) foot.push(`Not in apps.yaml: ${state.unlisted.join(", ")}`);
  const checked = state.host.updates_checked;
  foot.push(checked ? `Checked for updates ${dur(Date.now() / 1000 - checked)} ago` : "Not checked for updates yet");
  $("foot").textContent = foot.join(" · ");
}

// Only the newest answer is drawn, so a slow one can't land after a fresher one and undo it.
let seq = 0, asking = 0;  // asking: when the newest request left, 0 once it's answered
async function refresh() {
  const n = ++seq;
  asking = Date.now();
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const s = await r.json();
    if (n !== seq) return;
    state = s;
    draw();
    $("offline").classList.remove("show");
    status();
  } catch {
    if (n !== seq) return;
    $("offline").classList.add("show");
    $("status").textContent = state ? "Showing the last known state" : "Can’t connect";
  } finally {
    if (n === seq) asking = 0;
  }
}

// A redraw replaces every button. One landing between a finger going down and coming up swallows the
// tap, so a poll that arrives mid-touch waits until just after the tap has gone through.
// A finger held past 2 seconds isn't a tap, and a lost "lift" event mustn't freeze the screen, so then it redraws anyway.
let touchedAt = 0, owed = false;
const touching = () => touchedAt && Date.now() - touchedAt < 2000;
function draw() { if (touching()) owed = true; else { owed = false; render(); } }
document.addEventListener("pointerdown", () => { touchedAt = Date.now(); }, true);
for (const ev of ["pointerup", "pointercancel"]) document.addEventListener(ev, () => {
  touchedAt = 0;
  if (owed) setTimeout(() => { if (owed && !touching()) { owed = false; render(); } }, 120);
}, true);

// The one line under the title, about the tab you're on.
function status() {
  if (!state) return;
  const s = $("status"); s.replaceChildren();
  if (tab === "system") { s.append(`${state.host.name} · up ${dur(state.host.uptime)}`); return; }
  if (tab === "apps") { const p = state.programs || []; s.append(`${p.filter((x) => x.running).length} of ${p.length} open`); return; }
  const busy = state.apps.filter(working);
  if (busy.length) s.append(el("span", "live", busy.length === 1 ? `${cap(busy[0].busy)} ${busy[0].label}…` : `${busy.length} apps working…`));
  else s.append(`${state.apps.filter(lit).length} of ${state.apps.length} Docker apps on`);
}

// ---- tabs: System (memory first), Docker, Apps.
const TABS = ["system", "docker", "apps"];
// The panel opens on System, unless its link ends in #docker or #apps.
const asked = location.hash.slice(1);
let tab = TABS.includes(asked) ? asked : "system";
function setTab(t, focus = false) {
  tab = t;
  for (const name of TABS) {
    const b = $(`t-${name}`), on = name === t;
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
    $(`tab-${name}`).hidden = !on;
    if (on && focus) b.focus();
  }
  window.scrollTo(0, 0);
  status();
}
for (const b of document.querySelectorAll("#tabs button")) b.onclick = () => setTab(b.dataset.tab);
$("tabs").addEventListener("keydown", (e) => {
  const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
  if (step) setTab(TABS[(TABS.indexOf(tab) + step + TABS.length) % TABS.length], true);
});
setTab(tab);
$("bar").textContent = "Linux Remote";

// ---- logs
let logName = null;
async function loadLogs() {
  const pre = $("logtext");
  const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
  try {
    const r = await fetch(`/api/logs/${encodeURIComponent(logName)}?lines=${$("loglines").value}`, { cache: "no-store" });
    pre.textContent = r.ok ? (await r.text()) || "(no output)" : `Couldn’t load logs (${r.status}). Tap Refresh to try again.`;
  } catch { pre.textContent = "Can’t reach the PC. Tap Refresh to try again."; }
  if (atBottom || !pre.dataset.loaded) pre.scrollTop = pre.scrollHeight;
  pre.dataset.loaded = "1";
}
function openLogs(name) {
  logName = name;
  $("logtitle").textContent = name;
  $("logtext").textContent = "Loading…"; delete $("logtext").dataset.loaded;
  show("logs", true);
  $("logclose").focus({ preventScroll: true });
  loadLogs();
}
function closeLogs() { if (!logName) return; logName = null; show("logs", false); }
$("logclose").onclick = closeLogs;
$("logrefresh").onclick = loadLogs;
$("loglines").onchange = () => { delete $("logtext").dataset.loaded; loadLogs(); };

$("all-on").onclick = async () => {
  const gpuApps = (state?.apps || []).filter((a) => a.gpu).map((a) => a.label);
  if (gpuApps.length > 1 && !await ask("Start every app?", `${gpuApps.join(" and ")} share the GPU and may not fit together.`, "Start All")) return;
  markBusy((state?.apps || []).map((a) => a.id), "starting");
  try { await post("/api/apps/all/on"); } catch { toast("Can’t reach the PC right now."); }
  refresh();
};
$("all-off").onclick = async () => {
  if (!await ask("Stop every app?", "Data and settings are kept.", "Stop All", true)) return;
  markBusy((state?.apps || []).filter(lit).map((a) => a.id), "stopping");
  try { await post("/api/apps/all/off"); } catch { toast("Can’t reach the PC right now."); }
  refresh();
};

// The small title bar fades in once the big title scrolls away.
new IntersectionObserver(([e]) => $("bar").classList.toggle("show", !e.isIntersecting), { rootMargin: "-40px 0px 0px 0px" }).observe($("title"));

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
refresh();
// Skip a beat while the last request is still out (slow signal, or waiting behind the lock screen),
// so they don't pile up; one stuck past 15 seconds doesn't stop the polling.
setInterval(() => { if (!document.hidden && !logName && !answer && Date.now() - asking > 15000) refresh(); }, 3000);
setInterval(() => { if (!document.hidden && logName) loadLogs(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
