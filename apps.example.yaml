# Copy this file to apps.yaml (which stays out of git) and list the Docker apps on your machine.
# `dock` (terminal) and the phone panel (dock panel) both read apps.yaml; edit it to add an app.
#
# Each app is either:
#   compose:    a docker compose project  -> dir, file, project (the project name Docker already uses)
#   containers: standalone `docker run` containers -> list of container names
# Optional `up:` is the command (run in `dir`) that creates the app if its containers don't exist yet.
# Optional `after_start:` runs (in `dir`) after the app is started or restarted.
# Optional `gpu: true` marks an app that uses the NVIDIA card. Starting one while another GPU app
#   (or a program outside Docker) is on the card asks first, since they share its memory.
# Optional `web:` lists the app's web pages by host port. The panel works out the phone and PC
#   links itself from Docker's port bindings and `tailscale serve status`, so nothing here goes stale.
#   Add `pc: tailnet` to an entry whose app only works on its tailnet address.
#   Add `upstream: <port>` when `port` is a lock/key gate in front of the container's own port (VoiceStudio).
#   To put a page on the phone: bind it to 127.0.0.1 in compose, then
#   `tailscale serve --bg --https=<port> http://127.0.0.1:<port>` (tailnet only, HTTPS).
# Starting/stopping keeps containers, volumes and data; nothing here deletes anything.
#
# Secrets stay in each project's own .env, never in this file.

panel:
  port: 9000          # listens on 127.0.0.1 only; `tailscale serve` exposes it to your tailnet
  disks:
    - {label: System, path: /}
  # backup_status: /path/to/backups/status.json   # optional: shows the last backup on the panel

# Desktop programs (not Docker) the panel can open on this PC's screen, e.g. Chrome so Claude can
# browse while you're away. `launch` is the .desktop file's name without .desktop (see
# /usr/share/applications, ~/.local/share/applications). `process` is a `pgrep -f` pattern that
# finds it running (or `exe`, the start of its program file's path, for programs that rewrite their
# command line); its oldest match gets a polite quit on Close, and whatever of it is still up 15
# seconds later is made to quit. The PC must be logged in.
# Optional `close_after_hours`: close it that long after the panel or `dock open` opened it
# (`dock later <program>` or the panel's +1 hour pushes it back). One you opened at the PC is left alone.
# Optional `close_when_idle_minutes`: close it, however it was opened, once nobody has touched the PC's
# keyboard or mouse for that long (counted from when it opened, if that's later). Needs GNOME.
programs:
  chrome:
    label: Google Chrome
    note: For Claude in Chrome research
    launch: google-chrome
    process: /opt/google/chrome/chrome
    close_after_hours: 2   # Chrome holds 1-3 GB; this frees it if it's forgotten
  localsend:
    label: LocalSend
    note: Send files between phone and PC
    launch: localsend_app
    process: localsend_app
    close_when_idle_minutes: 30
  claude:
    label: Claude
    note: Desktop app
    launch: com.anthropic.Claude
    process: /usr/lib/claude-desktop/

apps:
  movies:
    label: Movies
    note: Jellyfin media server
    compose:
      project: media-stack
      dir: ~/media-stack
      file: docker-compose.yml
    web:
      - {label: Jellyfin, port: 8096}

  helper:
    label: Helper
    note: a standalone container started with docker run
    containers: [helper]
    web:
      - {label: Helper, port: 8080}

  atvloadly:
    label: AtvLoadly
    note: Apple TV sideloader (its compose file is in atvloadly/)
    compose:
      project: atvloadly
      dir: ~/docker-master/atvloadly
      file: compose.yaml
    web:
      - {label: AtvLoadly, port: 5533}
